name: Bug report
description: Something in Glintmotion does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glintmotion version
      description: Shown in À propos (About), at the bottom of the sidebar.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or project files
      description: A screenshot, a short screen recording, or the smallest composition that shows the problem.
