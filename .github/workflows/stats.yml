name: Refresh numbers

on:
  schedule:
    - cron: "0 6 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-numbers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build buttons and the numbers card
        run: node scripts/assets.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit when something changed
        run: |
          git add data/stats.json assets/buttons assets/stats
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stats): refresh the numbers [skip ci]"
          git push
