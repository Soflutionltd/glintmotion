<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Manrope"; font-weight: 500; src: url("fonts/Manrope-Medium.ttf") format("truetype"); }
      @font-face { font-family: "Manrope"; font-weight: 600; src: url("fonts/Manrope-SemiBold.ttf") format("truetype"); }
      @font-face { font-family: "Manrope"; font-weight: 800; src: url("fonts/Manrope-ExtraBold.ttf") format("truetype"); }

      html, body { margin: 0; background: transparent; }
      #root {
        position: relative;
        width: 1600px;
        height: 560px;
        overflow: hidden;
        font-family: "Manrope", sans-serif;
        font-feature-settings: "kern" 1, "liga" 1;
      }

      .card {
        position: absolute;
        inset: 0;
        border-radius: 40px;
        overflow: hidden;
        background: linear-gradient(128deg, #15171b 0%, #0b0c0e 55%, #0b120f 100%);
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.08);
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1.2px, transparent 1.4px);
        background-size: 28px 28px;
        -webkit-mask-image: radial-gradient(ellipse 70% 90% at 72% 50%, #000 0%, transparent 75%);
        mask-image: radial-gradient(ellipse 70% 90% at 72% 50%, #000 0%, transparent 75%);
      }
      .glow {
        position: absolute;
        left: -120px;
        top: -220px;
        width: 760px;
        height: 760px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(79, 219, 94, 0.22) 0%, rgba(6, 227, 250, 0.08) 42%, transparent 70%);
        opacity: 0.75;
      }
      .glow-right {
        position: absolute;
        right: -160px;
        bottom: -300px;
        width: 820px;
        height: 820px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(6, 227, 250, 0.14) 0%, transparent 65%);
      }

      .brand {
        position: absolute;
        left: 96px;
        top: 0;
        bottom: 0;
        width: 880px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .mark-row { display: flex; align-items: center; gap: 30px; }
      .mark { width: 124px; height: 124px; flex: none; filter: drop-shadow(0 18px 40px rgba(6, 227, 250, 0.18)); }
      .wordmark {
        position: relative;
        margin: 0;
        font-size: 112px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        color: #f3f4f6;
        padding-bottom: 10px;
      }
      .wordmark .shine {
        position: absolute;
        inset: 0;
        color: transparent;
        background: linear-gradient(100deg, transparent 38%, rgba(6, 227, 250, 0.95) 46%, rgba(255, 255, 255, 1) 50%, rgba(79, 219, 94, 0.95) 54%, transparent 62%);
        background-size: 260% 100%;
        background-position: 130% 0;
        -webkit-background-clip: text;
        background-clip: text;
      }
      .tagline {
        margin: 34px 0 0;
        font-size: 33px;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.01em;
        color: #a6acb4;
        max-width: 820px;
      }
      .tagline strong { color: #e8eaed; font-weight: 600; }
      .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 40px; }
      .chip {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 17px 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.09);
        font-size: 18px;
        font-weight: 600;
        color: #d7dbe0;
      }
      .chip i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(135deg, #06e3fa, #4fdb5e);
        box-shadow: 0 0 12px rgba(79, 219, 94, 0.6);
      }

      .studio {
        position: absolute;
        left: 1004px;
        top: 52px;
        width: 540px;
        height: 456px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.035);
        box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.08), 0 30px 80px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .titlebar { position: absolute; left: 20px; top: 18px; display: flex; gap: 8px; }
      .titlebar b { width: 11px; height: 11px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
      .timecode {
        position: absolute;
        right: 22px;
        top: 13px;
        font: 600 15px/1 "SF Mono", ui-monospace, Menlo, monospace;
        letter-spacing: 0.04em;
        color: #8d939b;
      }
      .preview {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 44px;
        height: 238px;
        border-radius: 16px;
        background: radial-gradient(ellipse 80% 90% at 50% 40%, #16201c 0%, #0c0e10 70%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }
      .preview svg { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; overflow: visible; }
      .scene-label {
        position: absolute;
        left: 16px;
        top: 14px;
        font: 600 13px/1 "SF Mono", ui-monospace, Menlo, monospace;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.4);
      }
      .tracks { position: absolute; left: 16px; right: 16px; top: 298px; bottom: 16px; }
      .track { position: absolute; left: 0; right: 0; height: 26px; }
      .track span {
        position: absolute;
        top: 0;
        height: 26px;
        border-radius: 7px;
      }
      .track .name {
        position: absolute;
        left: 0;
        top: 6px;
        width: 70px;
        font: 600 12px/1 "SF Mono", ui-monospace, Menlo, monospace;
        color: rgba(255, 255, 255, 0.38);
      }
      .lane { position: absolute; left: 78px; right: 0; top: 0; height: 26px; }
      .diamond {
        position: absolute;
        top: 7px;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        transform: rotate(45deg);
        border-radius: 2px;
        background: #f3f4f6;
        opacity: 0.45;
      }
      .wave { position: absolute; inset: 3px 0; display: flex; align-items: center; gap: 3px; padding: 0 8px; }
      .wave em { flex: 1; border-radius: 2px; background: rgba(79, 219, 94, 0.55); }
      .playhead {
        position: absolute;
        left: 78px;
        top: -10px;
        bottom: -4px;
        width: 2px;
        margin-left: -1px;
        background: linear-gradient(180deg, #06e3fa, #4fdb5e);
        box-shadow: 0 0 14px rgba(6, 227, 250, 0.7);
      }
      .playhead::before {
        content: "";
        position: absolute;
        left: -6px;
        top: -4px;
        width: 14px;
        height: 10px;
        border-radius: 3px;
        background: #06e3fa;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="banner" data-start="0" data-duration="6" data-fps="30" data-width="1600" data-height="560">
      <div id="card" class="card">
        <div class="dots"></div>
        <div id="glow" class="glow"></div>
        <div class="glow-right"></div>

        <div class="brand">
          <div class="mark-row">
            <svg class="mark" viewBox="100 100 824 824" aria-hidden="true">
              <defs>
                <linearGradient id="m-bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#1B1D21" />
                  <stop offset="1" stop-color="#0B0C0E" />
                </linearGradient>
                <linearGradient id="m-gm" x1="6" y1="58" x2="58" y2="6" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#06E3FA" />
                  <stop offset="1" stop-color="#4FDB5E" />
                </linearGradient>
                <radialGradient id="m-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 430) rotate(90) scale(330)">
                  <stop stop-color="#4FDB5E" stop-opacity="0.32" />
                  <stop offset="1" stop-color="#06E3FA" stop-opacity="0" />
                </radialGradient>
              </defs>
              <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#m-bg)" />
              <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" stroke="white" stroke-opacity="0.1" stroke-width="3" fill="none" />
              <circle cx="600" cy="430" r="330" fill="url(#m-glow)" />
              <g transform="translate(192 192) scale(10)">
                <g id="mark-star" style="transform-origin: 40px 24px; transform-box: view-box">
                  <path d="M40 6C41.7 19.2 44.8 22.3 58 24C44.8 25.7 41.7 28.8 40 42C38.3 28.8 35.2 25.7 22 24C35.2 22.3 38.3 19.2 40 6Z" fill="url(#m-gm)" />
                </g>
                <path d="M9 51L27 39" stroke="url(#m-gm)" stroke-width="5" stroke-linecap="round" />
                <path d="M17 58L30 49.3" stroke="url(#m-gm)" stroke-width="4" stroke-linecap="round" opacity="0.7" />
                <path d="M6 40.5L17.5 32.8" stroke="url(#m-gm)" stroke-width="3.5" stroke-linecap="round" opacity="0.45" />
              </g>
            </svg>
            <h1 class="wordmark">Glintmotion<span id="shine" class="shine" aria-hidden="true">Glintmotion</span></h1>
          </div>
          <p class="tagline">The motion design studio <strong>your AI agent can drive</strong>.<br />HTML in, frame-perfect video out.</p>
          <div class="chips">
            <span class="chip"><i></i>Native macOS app</span>
            <span class="chip"><i></i>MCP for AI agents</span>
            <span class="chip"><i></i>Effects library</span>
            <span class="chip"><i></i>Built on HyperFrames</span>
          </div>
        </div>

        <div class="studio">
          <div class="titlebar"><b></b><b></b><b></b></div>
          <div id="timecode" class="timecode">00:00:00:00</div>
          <div class="preview">
            <div class="scene-label">SCENE 01</div>
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <defs>
                <linearGradient id="p-gm" x1="6" y1="58" x2="58" y2="6" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#06E3FA" />
                  <stop offset="1" stop-color="#4FDB5E" />
                </linearGradient>
                <radialGradient id="p-halo" cx="40" cy="24" r="22" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#4FDB5E" stop-opacity="0.35" />
                  <stop offset="1" stop-color="#06E3FA" stop-opacity="0" />
                </radialGradient>
              </defs>
              <circle id="p-halo-dot" cx="40" cy="24" r="22" fill="url(#p-halo)" style="transform-origin: 40px 24px; transform-box: view-box" />
              <g id="p-star" style="transform-origin: 40px 24px; transform-box: view-box">
                <path d="M40 6C41.7 19.2 44.8 22.3 58 24C44.8 25.7 41.7 28.8 40 42C38.3 28.8 35.2 25.7 22 24C35.2 22.3 38.3 19.2 40 6Z" fill="url(#p-gm)" />
              </g>
              <path class="streak" d="M9 51L27 39" stroke="url(#p-gm)" stroke-width="5" stroke-linecap="round" fill="none" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100" />
              <path class="streak" d="M17 58L30 49.3" stroke="url(#p-gm)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100" />
              <path class="streak" d="M6 40.5L17.5 32.8" stroke="url(#p-gm)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.45" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100" />
            </svg>
          </div>
          <div class="tracks">
            <div class="track" style="top: 0">
              <div class="name">title</div>
              <div class="lane">
                <span style="left: 0; width: 46%; background: rgba(6, 227, 250, 0.22); box-shadow: inset 0 0 0 1px rgba(6, 227, 250, 0.35)"></span>
                <span style="left: 52%; width: 48%; background: rgba(6, 227, 250, 0.14); box-shadow: inset 0 0 0 1px rgba(6, 227, 250, 0.25)"></span>
              </div>
            </div>
            <div class="track" style="top: 36px">
              <div class="name">glint</div>
              <div class="lane">
                <span style="left: 0; width: 100%; background: rgba(255, 255, 255, 0.05); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08)"></span>
                <i class="diamond" data-at="0.12"></i>
                <i class="diamond" data-at="0.3"></i>
                <i class="diamond" data-at="0.5"></i>
                <i class="diamond" data-at="0.68"></i>
                <i class="diamond" data-at="0.88"></i>
              </div>
            </div>
            <div class="track" style="top: 72px">
              <div class="name">streaks</div>
              <div class="lane">
                <span style="left: 6%; width: 30%; background: rgba(79, 219, 94, 0.2); box-shadow: inset 0 0 0 1px rgba(79, 219, 94, 0.35)"></span>
                <span style="left: 56%; width: 30%; background: rgba(79, 219, 94, 0.2); box-shadow: inset 0 0 0 1px rgba(79, 219, 94, 0.35)"></span>
              </div>
            </div>
            <div class="track" style="top: 108px">
              <div class="name">music</div>
              <div class="lane">
                <span style="left: 0; width: 100%; background: rgba(79, 219, 94, 0.07); box-shadow: inset 0 0 0 1px rgba(79, 219, 94, 0.18)"><span id="wave" class="wave"></span></span>
              </div>
            </div>
            <div id="playhead" class="playhead"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const DURATION = 6;
        const FPS = 30;
        const tl = gsap.timeline({ paused: true });

        let seed = 0x9e3779b1;
        const random = () => {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        const wave = document.getElementById("wave");
        for (let i = 0; i < 64; i += 1) {
          const bar = document.createElement("em");
          bar.style.height = `${Math.round(20 + random() * 80)}%`;
          wave.appendChild(bar);
        }

        // Laid out in lane units (0..1), so nothing depends on measured sizes.
        const laneStart = 78;
        const laneWidth = 540 - 32 - laneStart;
        tl.fromTo("#playhead", { x: 0 }, { x: laneWidth, duration: DURATION, ease: "none" }, 0);

        document.querySelectorAll(".diamond").forEach((diamond) => {
          const at = Number(diamond.dataset.at);
          diamond.style.left = `${at * 100}%`;
          const time = at * DURATION;
          tl.to(diamond, { opacity: 1, scale: 1.45, backgroundColor: "#06e3fa", duration: 0.16, ease: "power2.out" }, time);
          tl.to(diamond, { opacity: 0.45, scale: 1, backgroundColor: "#f3f4f6", duration: 0.6, ease: "power2.out" }, time + 0.16);
        });

        // The star has four-fold symmetry: a quarter turn per loop joins seamlessly.
        tl.fromTo("#p-star", { rotation: 0 }, { rotation: 90, duration: DURATION, ease: "none" }, 0);
        tl.to("#p-halo-dot", { scale: 1.25, opacity: 0.6, duration: DURATION / 2, ease: "sine.inOut" }, 0);
        tl.to("#p-halo-dot", { scale: 1, opacity: 1, duration: DURATION / 2, ease: "sine.inOut" }, DURATION / 2);

        document.querySelectorAll(".streak").forEach((streak, index) => {
          for (const start of [0.36, 3.36]) {
            const at = start + index * 0.14;
            tl.fromTo(streak, { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, at);
            tl.to(streak, { strokeDashoffset: -100, duration: 0.8, ease: "power2.in" }, at + 1.2);
          }
        });

        tl.to("#glow", { scale: 1.08, opacity: 1, duration: DURATION / 2, ease: "sine.inOut" }, 0);
        tl.to("#glow", { scale: 1, opacity: 0.75, duration: DURATION / 2, ease: "sine.inOut" }, DURATION / 2);

        tl.fromTo("#shine", { backgroundPosition: "130% 0" }, { backgroundPosition: "-30% 0", duration: 1.3, ease: "power2.inOut" }, 0.9);
        tl.fromTo("#mark-star", { scale: 1 }, { scale: 1.12, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 }, 1.0);

        const timecode = document.getElementById("timecode");
        const pad = (value) => String(value).padStart(2, "0");
        tl.eventCallback("onUpdate", () => {
          const frames = Math.min(Math.round(tl.time() * FPS), DURATION * FPS - 1);
          timecode.textContent = `00:00:${pad(Math.floor(frames / FPS))}:${pad(frames % FPS)}`;
        });
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines["banner"] = tl;
      })();
    </script>
  </body>
</html>
